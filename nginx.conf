server {
    listen 80;
    listen [::]:80;
    server_name _;          # replace _ with your domain, e.g. valleyofthesunmoving.com

    root /var/www/valleyofthesunmoving;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(html|css|js|ico|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
