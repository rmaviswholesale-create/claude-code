server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS is pointed to this VPS:
    # server_name valleyofthesunmoving.com www.valleyofthesunmoving.com;
    server_name _;

    root /var/www/valleyofthesunmoving;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|css|js|ico|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
