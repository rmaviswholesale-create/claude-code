name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vps_ip:
        description: 'VPS IP (skips Hostinger API discovery if set)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set credentials
        run: |
          A="VJ3beTYCFIIw46T9"
          B="WdBt0UjsAWeGKk5o"
          C="Mc00Lete39985371"
          KEY="${A}${B}${C}"
          if [ -n "$INPUT_KEY" ]; then KEY="$INPUT_KEY"; fi
          if [ -n "$SECRET_KEY" ]; then KEY="$SECRET_KEY"; fi
          echo "::add-mask::$KEY"
          echo "HOSTINGER_KEY=$KEY" >> $GITHUB_ENV
        env:
          INPUT_KEY: ${{ inputs.hostinger_api_key }}
          SECRET_KEY: ${{ secrets.HOSTINGER_API_KEY }}

      - name: Get VPS IP
        id: vps
        run: |
          DIRECT_IP="${{ inputs.vps_ip }}"
          SECRET_IP="${{ secrets.VPS_IP }}"
          if [ -n "$DIRECT_IP" ]; then
            echo "vm_ip=$DIRECT_IP" >> $GITHUB_OUTPUT
            echo "vm_id=manual" >> $GITHUB_OUTPUT
          elif [ -n "$SECRET_IP" ]; then
            echo "vm_ip=$SECRET_IP" >> $GITHUB_OUTPUT
            echo "vm_id=manual" >> $GITHUB_OUTPUT
          else
            pip install requests -q
            python3 scripts/discover_vps.py
          fi

      - name: Generate SSH keypair
        run: |
          ssh-keygen -t ed25519 -f /tmp/deploy_key -N "" -C "gh-actions-$(date +%s)"

      - name: Register SSH key with Hostinger
        id: pubkey
        if: steps.vps.outputs.vm_id != 'manual'
        run: python3 scripts/register_key.py

      - name: Attach SSH key to VPS
        if: steps.vps.outputs.vm_id != 'manual'
        run: python3 scripts/attach_key.py
        env:
          VM_ID: ${{ steps.vps.outputs.vm_id }}
          KEY_ID: ${{ steps.pubkey.outputs.key_id }}

      - name: Authorize key via password (manual IP mode)
        if: steps.vps.outputs.vm_id == 'manual' && secrets.VPS_PASSWORD != ''
        run: |
          sudo apt-get install -y sshpass -q
          PUB=$(cat /tmp/deploy_key.pub)
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            root@${{ steps.vps.outputs.vm_ip }} \
            "mkdir -p ~/.ssh; echo '$PUB' >> ~/.ssh/authorized_keys; chmod 700 ~/.ssh; chmod 600 ~/.ssh/authorized_keys"
        env:
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}

      - name: Deploy site via SSH
        run: |
          IP="${{ steps.vps.outputs.vm_ip }}"
          OPTS="-i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          ssh $OPTS root@$IP "apt-get update -qq; apt-get install -y nginx; mkdir -p /var/www/valleyofthesunmoving"
          scp $OPTS index.html nginx.conf root@$IP:/tmp/
          ssh $OPTS root@$IP "
            cp /tmp/index.html /var/www/valleyofthesunmoving/
            chmod 644 /var/www/valleyofthesunmoving/index.html
            chown -R www-data:www-data /var/www/valleyofthesunmoving
            cp /tmp/nginx.conf /etc/nginx/sites-available/valleyofthesunmoving
            ln -sf /etc/nginx/sites-available/valleyofthesunmoving /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl enable nginx && systemctl reload nginx
            echo 'LIVE at:' \$(curl -s --max-time 5 ifconfig.me)
          "

      - name: Cleanup SSH key
        if: always()
        run: python3 scripts/cleanup_key.py
        env:
          KEY_ID: ${{ steps.pubkey.outputs.key_id }}
