name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy site files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "index.html,nginx.conf"
          target: "/tmp/vots-deploy"

      - name: Install nginx and activate site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Install nginx if missing
            if ! command -v nginx &>/dev/null; then
              apt-get update -qq && apt-get install -y nginx
            fi

            # Deploy site files
            mkdir -p /var/www/valleyofthesunmoving
            cp /tmp/vots-deploy/index.html /var/www/valleyofthesunmoving/
            chmod 644 /var/www/valleyofthesunmoving/index.html
            chown -R www-data:www-data /var/www/valleyofthesunmoving

            # Install nginx config
            cp /tmp/vots-deploy/nginx.conf /etc/nginx/sites-available/valleyofthesunmoving
            ln -sf /etc/nginx/sites-available/valleyofthesunmoving \
                   /etc/nginx/sites-enabled/valleyofthesunmoving
            rm -f /etc/nginx/sites-enabled/default

            # Validate and reload
            nginx -t
            systemctl enable nginx
            systemctl reload nginx

            echo "Site deployed successfully!"
            curl -s http://localhost | grep -o '<title>.*</title>' || true
